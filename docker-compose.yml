services:
    ollama_llm:
        image: ollama/ollama:latest
        container_name: ollama_llm
        # ports:
            # - "11434:11434"
        volumes:
            - ./model_files:/model_files
        environment:
            - OLLAMA_HOST=0.0.0.0:11434
            - OLLAMA_KEEP_ALIVE=-1
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        tty: true
        entrypoint: ["/bin/sh", "model_files/run_ollama.sh"]
        restart: no
        
    ollama_embedding:
        image: ollama/ollama:latest
        container_name: ollama_embedding
        # ports:
            # - "11434:11434"
        volumes:
            - ./model_files:/model_files
        environment:
            - OLLAMA_HOST=0.0.0.0:11434
            - OLLAMA_KEEP_ALIVE=-1
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        tty: true
        entrypoint: ["/bin/sh", "model_files/run_ollama_embedding.sh"]
        restart: no
    
    langgraph:
        build: 
            context: .
            dockerfile: Dockerfile
        container_name: langgraph
        ports:
            - "8000:8000"
        depends_on:
            ollama_llm:
                condition: service_started
            ollama_embedding:
                condition: service_started
        env_file:
            - .env
        volumes:
            - ./langgraph_app:/app
        command: uvicorn main_app:app --host 0.0.0.0 --port 8000
        restart: no
        
    chromadb:
        image: chromadb/chroma:latest
        container_name: chromadb
        ports:
            - "8001:8000"
        environment:
            ANONYMIZED_TELEMETRY: "FALSE"
            IS_PERSISTENT: "TRUE"
            CHROMA_SERVER_HTTP_PORT: "8000"
        volumes:
            - ./chroma_data:/data
        restart: no